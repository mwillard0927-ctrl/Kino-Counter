<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Drawer Bill Count</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
/* VOICE: quick, sure, bar-shift practical — big numbers, zero fuss.
   IDEA: a cashier's counting tray — one bill at a time, then a tally slip.
   PICTURE: the drawn bill being counted, large, sliding in on each Next.
   COLOUR and TYPE: money-green band, white paper, gold Next; Archivo 900 numerals.
   LAYOUT: tabs + running total, bill strip, bill + count, huge keypad, Next. */
:root{color-scheme:light dark;--bg:light-dark(#f2f5ef,#0d1411);--card:light-dark(#fff,#18221d);--ink:light-dark(#12201a,#eef3ef);--mute:light-dark(#56665d,#9fb1a6);--line:light-dark(#d8dfd6,#2b3832);--deep:light-dark(#0f3d2a,#0b2c1f);--gold:#f6b800;--goldsh:#b98a00;--goldink:#1c1400;--key:light-dark(#fff,#1f2b25);--keysh:light-dark(#c4cec2,#050806)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 Archivo,system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
.top{background:var(--deep);color:#fff;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;z-index:5}
.tabs{display:flex;background:rgba(255,255,255,.13);border-radius:12px;padding:3px}
.tabs button{all:unset;cursor:pointer;padding:10px 16px;border-radius:9px;font-weight:800;font-size:16px;color:#cfe3d6}
.tabs button.on{background:#fff;color:#0f3d2a}
.run{text-align:right;line-height:1.1}
.run small{display:block;font-size:13px;color:#b5cfbf;font-weight:500}
.run b{font-size:24px;color:var(--gold);font-weight:900}
.wrap{max-width:520px;margin:0 auto;padding:12px 14px 22px}
.picker{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px}
.chip{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 3px 3px;border-radius:10px;border:2px solid transparent;touch-action:manipulation}
.chip svg{width:100%;height:auto;display:block;border-radius:2px;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.chip span{font-size:13px;font-weight:800;color:var(--mute)}
.chip.seen span{color:var(--ink)}
.chip.on{border-color:var(--ink);background:var(--card)}
.stage{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:14px;align-items:center;margin:14px 0 12px}
.bigbill svg{width:100%;height:auto;display:block;border-radius:6px;box-shadow:0 8px 18px -8px rgba(0,0,0,.5),0 1px 1px rgba(0,0,0,.2)}
.bigbill.in{animation:slide .28s ease-out}
@keyframes slide{from{transform:translateX(44px) rotate(3deg);opacity:0}}
.lbl{font-size:16px;font-weight:800;display:flex;gap:7px;align-items:center}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.cnt{font-size:clamp(54px,17vw,90px);font-weight:900;line-height:.95;letter-spacing:-.02em}
.sub{font-size:20px;font-weight:800;color:var(--mute);white-space:nowrap}
.pad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pad button{all:unset;cursor:pointer;height:clamp(54px,8.6vh,78px);display:grid;place-items:center;background:var(--key);border-radius:14px;font-size:36px;font-weight:800;box-shadow:0 3px 0 var(--keysh);touch-action:manipulation;user-select:none;-webkit-user-select:none}
.pad button:active{transform:translateY(3px);box-shadow:0 0 0 var(--keysh)}
.pad .fn{font-size:22px;color:var(--mute)}
.navrow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;margin-top:10px}
.btn{all:unset;cursor:pointer;box-sizing:border-box;height:62px;border-radius:14px;display:grid;place-items:center;text-align:center;font-weight:800;font-size:18px;padding:0 18px;touch-action:manipulation}
.ghost{border:2px solid var(--line)}
.btn:disabled{opacity:.35;cursor:default}
.gold{background:var(--gold);color:var(--goldink);font-weight:900;font-size:22px;box-shadow:0 3px 0 var(--goldsh)}
.gold:active{transform:translateY(3px);box-shadow:none}
.rhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:4px 0 6px}
h2{font-size:28px;line-height:1.05;margin:0;font-weight:900}
.when{color:var(--mute);font-size:14px;font-weight:700;white-space:nowrap}
.row{display:grid;grid-template-columns:clamp(64px,20vw,92px) minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line)}
.row svg{width:100%;height:auto;display:block;border-radius:3px;box-shadow:0 2px 4px rgba(0,0,0,.25)}
.rx{font-size:clamp(26px,8.5vw,36px);font-weight:900;white-space:nowrap}
.rv{font-size:clamp(20px,6.6vw,28px);font-weight:800;text-align:right;white-space:nowrap}
.row.zero{opacity:.4}
.grand{margin:16px 0 0;background:var(--deep);color:#fff;padding:18px 14px;text-align:center;border-radius:18px}
.grand span{display:block;font-size:17px;font-weight:700;color:#b5cfbf}
.grand b{display:block;font-size:clamp(50px,16vw,84px);font-weight:900;color:var(--gold);line-height:1.05;letter-spacing:-.02em}
.grand small{font-size:17px;color:#d4e6da;font-weight:700}
.acts{display:grid;gap:8px;margin-top:14px}
.hint{color:var(--mute);margin:4px 0 14px;font-size:15px}
ol{list-style:none;margin:0;padding:0}
.h{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.hTop{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.hd{font-weight:700;font-size:15px;color:var(--mute)}
.ht{font-size:28px;font-weight:900;white-space:nowrap}
.hcs{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0 10px}
.hc{font-size:14px;font-weight:700;padding:3px 9px;border-radius:999px;background:color-mix(in srgb,var(--a) 15%,transparent);border:1px solid color-mix(in srgb,var(--a) 50%,transparent);white-space:nowrap}
.hc b{margin-left:3px}
.hA{display:flex;gap:8px;align-items:center}
.hA .btn{height:44px;font-size:16px;padding:0 16px}
.hA .bills{margin-left:auto;color:var(--mute);font-weight:700;font-size:14px}
.del.armed{background:#c62828;color:#fff;border-color:#c62828}
.empty{text-align:center;color:var(--mute);padding:40px 10px;border:2px dashed var(--line);border-radius:16px}
@media (prefers-reduced-motion:reduce){.bigbill.in{animation:none}}
</style>
</head>
<body>
<header class="top">
  <div class="tabs" role="tablist">
    <button id="tCount" class="on" role="tab">Count</button>
    <button id="tHist" role="tab">History</button>
  </div>
  <div class="run"><small>Drawer total</small><b id="run" class="num">$0</b></div>
</header>

<main class="wrap" id="vCount">
  <div id="counter">
    <nav class="picker" id="picker" aria-label="Bills"></nav>
    <section class="stage">
      <div class="bigbill" id="bigbill"></div>
      <div>
        <div class="lbl"><i class="dot" id="dot"></i><span id="lbl">$1 bills</span></div>
        <div class="cnt num" id="cnt">0</div>
        <div class="sub num" id="sub">= $0</div>
      </div>
    </section>
    <div class="pad" id="pad">
      <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
      <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
      <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
      <button data-k="c" class="fn">Clear</button><button data-k="0">0</button><button data-k="b" class="fn" aria-label="Backspace">⌫</button>
    </div>
    <div class="navrow">
      <button class="btn ghost" id="back">‹ Back</button>
      <button class="btn gold" id="next">Next ›</button>
    </div>
  </div>

  <div id="results" hidden>
    <div class="rhead"><h2>Drawer count</h2><span class="when" id="rtime"></span></div>
    <div id="rows"></div>
    <div class="grand"><span>Grand total</span><b id="gt" class="num">$0</b><small id="gbills" class="num"></small></div>
    <div class="acts">
      <button class="btn gold" id="save">Save to history</button>
      <button class="btn ghost" id="edit">Edit counts</button>
      <button class="btn ghost" id="newc">New count</button>
    </div>
  </div>
</main>

<main class="wrap" id="vHist" hidden>
  <h2>History</h2>
  <p class="hint">Saved audits on this phone, newest first.</p>
  <ol id="hlist"></ol>
</main>

<script>
{
const B=[
  {v:1,c:'#5f7d62',w:'ONE DOLLAR'},
  {v:5,c:'#7d4fb0',w:'FIVE DOLLARS'},
  {v:10,c:'#e07a1a',w:'TEN DOLLARS'},
  {v:20,c:'#2f8f4e',w:'TWENTY DOLLARS'},
  {v:50,c:'#d0457c',w:'FIFTY DOLLARS'},
  {v:100,c:'#1f7ccc',w:'ONE HUNDRED DOLLARS'}];
const $=id=>document.getElementById(id);
const money=n=>'$'+n.toLocaleString('en-US');
const fmtT=t=>new Date(t).toLocaleString('en-US',{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
let gid=0;

function bill(b){
  const g='g'+(++gid),ink='#24432f';
  let ros='';
  for(let k=0;k<9;k++)ros+=`<ellipse cx="120" cy="51" rx="${30+k*5}" ry="${14+k*3.4}" transform="rotate(${k*20} 120 51)"/>`;
  const big=b.v>=100?24:28, seal=b.v>=100?16:22;
  return `<svg viewBox="0 0 240 102" role="img" aria-label="$${b.v} bill">
<defs><linearGradient id="${g}" x1="0" x2="1"><stop offset="0" stop-color="#edf1e3"/><stop offset=".55" stop-color="#e2e9d4"/><stop offset="1" stop-color="${b.c}" stop-opacity=".42"/></linearGradient></defs>
<rect width="240" height="102" rx="4" fill="url(#${g})"/>
<g fill="none" stroke="${ink}" stroke-width=".7" opacity=".16">${ros}</g>
<rect x="5" y="5" width="230" height="92" rx="3" fill="none" stroke="${ink}" stroke-width="1.8"/>
<rect x="9.5" y="9.5" width="221" height="83" rx="2" fill="none" stroke="${b.c}" stroke-width="1.2" stroke-dasharray="2.5 2"/>
<circle cx="120" cy="51" r="29" fill="${b.c}" fill-opacity=".2" stroke="${b.c}" stroke-width="2"/>
<circle cx="120" cy="51" r="23" fill="#f3f5ec" stroke="${ink}" stroke-width="1"/>
<text x="120" y="${51+seal*.36}" text-anchor="middle" font-family="Archivo,sans-serif" font-weight="900" font-size="${seal}" fill="${ink}">${b.v}</text>
<circle cx="50" cy="51" r="13" fill="none" stroke="${b.c}" stroke-width="1.6" stroke-dasharray="3 1.6"/>
<text x="50" y="56" text-anchor="middle" font-family="Archivo,sans-serif" font-weight="800" font-size="14" fill="${b.c}">$</text>
<text x="192" y="${51+big*.36}" text-anchor="middle" font-family="Archivo,sans-serif" font-weight="900" font-size="${big}" fill="${b.c}" stroke="${ink}" stroke-width=".6">${b.v}</text>
<g font-family="Archivo,sans-serif" font-weight="900" font-size="13" fill="${ink}">
<text x="16" y="26">${b.v}</text><text x="224" y="26" text-anchor="end">${b.v}</text>
<text x="16" y="88">${b.v}</text><text x="224" y="88" text-anchor="end">${b.v}</text></g>
<text x="120" y="91" text-anchor="middle" font-family="Archivo,sans-serif" font-weight="700" font-size="6.5" letter-spacing="1.2" fill="${ink}">${b.w}</text>
</svg>`;
}

let S={c:[0,0,0,0,0,0],seen:[0,0,0,0,0,0],i:0,done:false,saved:null,dirty:false,t:null};
let H=[],fresh=true;
try{Object.assign(S,JSON.parse(localStorage.getItem('kd_cur')||'{}'))}catch(e){}
try{H=JSON.parse(localStorage.getItem('kd_hist')||'[]')||[]}catch(e){}
const persist=()=>{try{localStorage.setItem('kd_cur',JSON.stringify(S));localStorage.setItem('kd_hist',JSON.stringify(H))}catch(e){}};
const total=c=>c.reduce((a,n,k)=>a+n*B[k].v,0);
const nbills=c=>c.reduce((a,n)=>a+n,0);
const buzz=()=>{try{navigator.vibrate&&navigator.vibrate(8)}catch(e){}};

$('picker').innerHTML=B.map((b,k)=>`<button class="chip" data-i="${k}" aria-label="$${b.v} bills">${bill(b)}<span class="num"></span></button>`).join('');
const chips=[...$('picker').children];

function updatePicker(){
  chips.forEach((ch,k)=>{
    ch.classList.toggle('on',k===S.i&&!S.done);
    ch.classList.toggle('seen',!!S.seen[k]);
    ch.querySelector('span').textContent=S.seen[k]?S.c[k].toLocaleString('en-US'):'–';
  });
  $('run').textContent=money(total(S.c));
}
function updateReadout(){
  const b=B[S.i],n=S.c[S.i];
  $('cnt').textContent=n.toLocaleString('en-US');
  $('sub').textContent='= '+money(n*b.v);
  updatePicker();
}
function renderStage(anim){
  const b=B[S.i],bb=$('bigbill');
  bb.innerHTML=bill(b);
  $('lbl').textContent='$'+b.v+' bills';
  $('dot').style.background=b.c;
  $('back').disabled=S.i===0;
  $('next').textContent=S.i<5?`Next · $${B[S.i+1].v} ›`:'Done · See totals';
  if(anim){bb.classList.remove('in');void bb.offsetWidth;bb.classList.add('in')}
  updateReadout();
}
function go(i){S.i=i;S.done=false;fresh=true;$('results').hidden=true;$('counter').hidden=false;renderStage(true);persist()}
function press(k){
  if(S.done)return;
  let s=String(S.c[S.i]);
  if(k==='c')s='0';
  else if(k==='b')s=s.slice(0,-1)||'0';
  else{const t=(fresh||s==='0')?k:s+k;if(t.length>4)return;s=t}
  fresh=false;S.c[S.i]=+s;S.seen[S.i]=1;S.dirty=true;buzz();updateReadout();persist();
}
function next(){S.seen[S.i]=1;if(S.i<5)go(S.i+1);else showResults()}

function saveLabel(){
  const b=$('save');
  if(S.saved&&!S.dirty){b.textContent='Saved ✓';b.disabled=true}
  else{b.textContent=S.saved?'Update saved audit':'Save to history';b.disabled=false}
}
function showResults(){
  S.done=true;if(!S.saved||S.dirty)S.t=Date.now();
  $('counter').hidden=true;$('results').hidden=false;
  $('rows').innerHTML=B.map((b,k)=>`<div class="row${S.c[k]?'':' zero'}"><div>${bill(b)}</div><div class="rx num">× ${S.c[k].toLocaleString('en-US')}</div><div class="rv num">${money(S.c[k]*b.v)}</div></div>`).join('');
  $('gt').textContent=money(total(S.c));
  const n=nbills(S.c);$('gbills').textContent=n.toLocaleString('en-US')+(n===1?' bill':' bills');
  $('rtime').textContent=fmtT(S.t);
  saveLabel();updatePicker();persist();window.scrollTo(0,0);
}
function save(){
  const rec={id:S.saved||Date.now(),t:S.t||Date.now(),c:[...S.c]};
  const j=H.findIndex(h=>h.id===rec.id);
  if(j>=0)H[j]=rec;else H.unshift(rec);
  H=H.slice(0,300);S.saved=rec.id;S.dirty=false;saveLabel();persist();renderHist();
}
function arm(btn,label,fn){
  if(btn.dataset.armed){fn();return}
  const old=btn.textContent;btn.dataset.armed=1;btn.textContent=label;btn.classList.add('armed');
  setTimeout(()=>{if(btn.isConnected){delete btn.dataset.armed;btn.textContent=old;btn.classList.remove('armed')}},3000);
}
function reset(){S={c:[0,0,0,0,0,0],seen:[0,0,0,0,0,0],i:0,done:false,saved:null,dirty:false,t:null};go(0)}

function renderHist(){
  const L=$('hlist');
  if(!H.length){L.innerHTML='<li class="empty">No saved audits yet.<br>Finish a count and tap “Save to history.”</li>';return}
  L.innerHTML=H.map(h=>`<li class="h"><div class="hTop"><span class="hd">${fmtT(h.t)}</span><b class="ht num">${money(total(h.c))}</b></div>
<div class="hcs">${B.map((b,k)=>`<span class="hc num" style="--a:${b.c}">$${b.v}<b>×${(+h.c[k]||0).toLocaleString('en-US')}</b></span>`).join('')}</div>
<div class="hA"><button class="btn ghost" data-open="${+h.id}">Open</button><button class="btn ghost del" data-del="${+h.id}">Delete</button><span class="bills num">${nbills(h.c).toLocaleString('en-US')} bills</span></div></li>`).join('');
}
function tab(t){
  $('tCount').classList.toggle('on',t==='count');$('tHist').classList.toggle('on',t==='hist');
  $('vCount').hidden=t!=='count';$('vHist').hidden=t!=='hist';
  if(t==='hist')renderHist();window.scrollTo(0,0);
}

$('pad').addEventListener('click',e=>{const k=e.target.closest('button');if(k)press(k.dataset.k)});
$('picker').addEventListener('click',e=>{const c=e.target.closest('.chip');if(c)go(+c.dataset.i)});
$('next').onclick=next;
$('back').onclick=()=>{if(S.i>0)go(S.i-1)};
$('save').onclick=save;
$('edit').onclick=()=>go(0);
$('newc').onclick=e=>{if(S.dirty||!S.saved)arm(e.currentTarget,'Not saved — tap again to clear',reset);else reset()};
$('tCount').onclick=()=>tab('count');
$('tHist').onclick=()=>tab('hist');
$('hlist').addEventListener('click',e=>{
  const o=e.target.closest('[data-open]'),d=e.target.closest('[data-del]');
  if(o){const h=H.find(x=>x.id===+o.dataset.open);if(!h)return;
    S={c:[...h.c],seen:[1,1,1,1,1,1],i:0,done:true,saved:h.id,dirty:false,t:h.t};tab('count');showResults()}
  if(d)arm(d,'Tap to confirm',()=>{H=H.filter(x=>x.id!==+d.dataset.del);if(S.saved===+d.dataset.del)S.saved=null;persist();renderHist()});
});
document.addEventListener('keydown',e=>{
  if($('vCount').hidden||e.metaKey||e.ctrlKey)return;
  if(/^[0-9]$/.test(e.key))press(e.key);
  else if(e.key==='Backspace'){e.preventDefault();press('b')}
  else if(e.key==='Escape')press('c');
  else if(e.key==='Enter'&&!S.done){e.preventDefault();next()}
});

if(S.done)showResults();else renderStage(false);
}
</script>
</body>
</html>
